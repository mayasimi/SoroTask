name: E2E Test Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  e2e:
    name: Run E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Modern Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install stellar-cli
        run: |
          curl -sSL https://github.com/stellar/stellar-cli/releases/download/v21.6.0/stellar-cli-21.6.0-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin
          stellar --version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: keeper/package-lock.json

      - name: Install Keeper Dependencies
        run: |
          cd keeper
          npm install

      - name: Start Soroban Network
        run: |
          chmod +x scripts/start-network.sh
          ./scripts/start-network.sh

      - name: Setup Contracts
        run: |
          chmod +x scripts/setup-contracts.sh
          ./scripts/setup-contracts.sh

      - name: Run E2E Test
        run: |
          cd keeper
          node __tests__/e2e-run.js

      - name: Export Logs on Failure
        if: failure()
        run: |
          docker logs soroban-local
